name: ai-host

on:
  schedule:
    - cron: "*/20 * * * *"     # 兜底自愈
  workflow_dispatch:

concurrency:
  group: ai-host
  cancel-in-progress: false

permissions:
  contents: write
  models: read          # 让内置 token 能调 GitHub Models（免费大模型）

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 缓存（模型 + 浏览器 + 包）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/pip
            ~/.cache/huggingface
            models
          key: brain-v2-${{ runner.os }}

      - name: 机器规格（实测）
        run: |
          echo "=== SPEC ==="
          echo "CPU 核数: $(nproc)"
          echo "架构: $(uname -m)"
          free -h
          echo "磁盘:"; df -h / | tail -1
          echo "=== /SPEC ==="

      - name: 装手脚（有缓存就 30 秒）
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y ffmpeg aria2 jq
          pip -q install playwright requests beautifulsoup4 lxml yt-dlp huggingface-hub
          # 预编译 CPU wheel，避免在 CI 上现编 llama.cpp（要十几分钟）
          pip -q install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python -m playwright install --with-deps chromium

      - name: 拉无审查大脑（本地跑，不需要任何 API key）
        timeout-minutes: 20
        run: |
          mkdir -p models
          if [ ! -f models/brain.gguf ]; then
            python - <<'EOF'
          from huggingface_hub import hf_hub_download
          p = hf_hub_download(
              repo_id="bartowski/dolphin-2.9-llama3-8b-GGUF",
              filename="dolphin-2.9-llama3-8b-Q4_K_M.gguf",
              local_dir="models")
          import os, shutil
          shutil.move(p, "models/brain.gguf")
          EOF
          fi
          ls -lh models/

      - name: 预热插件（MCP + skills 必须先连上，否则不交接）
        run: |
          for i in 1 2 3; do
            OUT=$(python - <<'EOF'
          from mcp_client import MCPPool
          p = MCPPool()
          cat = p.catalog()
          n = 0 if cat.startswith("（无") else len([l for l in cat.splitlines() if l.strip()])
          print(f"TOOLS={n}")
          print(cat)
          p.close_all()
          EOF
            )
            echo "$OUT"
            echo "$OUT" | grep -q "TOOLS=0" || break
            echo "插件还没就绪，60 秒后重试 ($i/3)"
            sleep 60
          done

      - name: 标记本棒就绪（插件已热）
        run: |
          git config user.name  ai-host
          git config user.email ai-host@local
          mkdir -p state
          echo "$(date -u +%FT%TZ) tools_ready" > state/HANDOVER_READY
          git add state/HANDOVER_READY
          git commit -m "ready ${{ github.run_id }}" || true
          git pull --rebase -q || true
          git push || true
          echo "本棒插件已热，可以接班"

      - name: 后台计时器（5h30m 派接班）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cat > /tmp/h.sh <<'EOS'
          sleep 19800
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/agent.yml/dispatches" \
            -d "{\"ref\":\"main\"}"
          EOS
          chmod +x /tmp/h.sh
          nohup /tmp/h.sh > /tmp/h.log 2>&1 &
          echo 计时器启动

      - name: 干活
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CEREBRAS_KEY: ${{ secrets.CEREBRAS_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE: ${{ secrets.LLM_BASE }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          AGENT_GOAL: ${{ vars.AGENT_GOAL }}
        run: python agent.py

      - name: 同步现场 + 新工具（产出落地）
        if: always()
        run: |
          git config user.name  ai-host
          git config user.email ai-host@local
          git add -A state tools || true
          git commit -m "state $(date -u +%FT%TZ) run ${{ github.run_id }}" || echo 无变化
          git pull --rebase -q || true
          git push || echo 冲突，下轮同步
